name: 디저트 소식 업데이트 & 배포

on:
  schedule:
    # GitHub 크론은 UTC 기준 → 03:00 UTC = 12:00 KST, 15:00 UTC = 24:00 KST
    - cron: "0 3,15 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]
    paths-ignore: ["public/data/**"]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 소식 수집
        if: github.event_name != 'push'
        env:
          KAKAO_REST_API_KEY: ${{ secrets.KAKAO_REST_API_KEY }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
        run: node scripts/collect.mjs

      - name: 데이터 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "dessert-bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/data/feed.json
          git diff --staged --quiet || git commit -m "data: $(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') 업데이트"
          git push

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - uses: actions/deploy-pages@v4
